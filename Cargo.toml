[package]
name = "nirufm"
version = "0.2.4"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Fast, light NIRU file manager for X11"

[dependencies]
x11rb = { version = "0.13", features = ["shm"] }
ab_glyph = "0.2"
resvg = { version = "0.45", default-features = false }
png = "0.17"
toml = "0.8"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
